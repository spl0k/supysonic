# Inspired by python-package

name: Tests
on:
  push:
    paths:
    - supysonic/**
    - tests/**
    - pyproject.toml
  pull_request:
    paths:
    - supysonic/**
    - tests/**
    - pyproject.toml
jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
      fail-fast: false
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[test]
    - name: Run tests
      run: |
        coverage run -m unittest
    - name: Upload coverage
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
      if: ${{ !cancelled() }}

  minimums:
    name: Lowest versions
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.10"
    - name: Install uv
      uses: astral-sh/setup-uv@v6
    - name: Install dependencies at their declared minimums
      run: uv pip install --system --resolution lowest-direct -e .[test,test-db]
    - name: Show resolved versions
      run: uv pip freeze --system
    - name: Run tests
      run: python -m unittest

  postgres:
    name: PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: supysonic
        ports:
        - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.13"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[test,test-db]
    - name: Enable citext extension
      run: psql "postgresql://postgres:postgres@localhost/supysonic" -c 'CREATE EXTENSION IF NOT EXISTS citext'
    - name: Run tests
      env:
        SUPYSONIC_TEST_DB_URI: postgres://postgres:postgres@localhost/supysonic
      run: |
        coverage run -m unittest
    - name: Upload coverage
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
      if: ${{ !cancelled() }}

  mariadb:
    name: MariaDB
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: supysonic
        ports:
        - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.13"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[test,test-db]
    - name: Run tests
      env:
        SUPYSONIC_TEST_DB_URI: mysql://root:root@127.0.0.1/supysonic
      run: |
        coverage run -m unittest
    - name: Upload coverage
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
      if: ${{ !cancelled() }}
