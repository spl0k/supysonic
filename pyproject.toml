[project]
name = "Supysonic"
description = "Python implementation of the Subsonic server API"
authors = [{ name = "Alban Féron", email = "alban.feron@gmail.com" }]
requires-python = ">=3.10"
keywords = ["subsonic", "music", "server"]
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "click >=8.1.3",
    "flask >=2.3.0",
    "flask-wtf >=1.2.1",
    "peewee >=3.17.8",
    "Pillow >=9.1.0",
    "requests >=2.31.0",
    "mediafile >=0.13.0",
    "watchdog >=1.0.0",
    "werkzeug >=2.3.0",
    "zipstream-ng >=1.1.0, <2.0.0",
]
dynamic = ["version"]

[project.optional-dependencies]
test = [
    "lxml >=4.6.4",
    "coverage[toml] >=6.0; python_version < '3.11'",
    "coverage >=6.0; python_version >= '3.11'",
]
test-db = [
    "psycopg2-binary >=2.9.1",
    "pymysql >=1.0.0",
]

[project.urls]
documentation = "https://supysonic.readthedocs.io"
source = "https://github.com/spl0k/supysonic"
issues = "https://github.com/spl0k/supysonic/issues"

[project.scripts]
supysonic-cli = "supysonic.cli:main"
supysonic-daemon = "supysonic.daemon:main"
supysonic-server = "supysonic.server:main"

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "supysonic.VERSION"}

[tool.setuptools.packages.find]
include = ["supysonic*"]

[tool.setuptools.package-data]
supysonic = ["schema/**", "templates/**", "static/**"]

[tool.isort]
profile = "black"
skip_gitignore = true

[tool.coverage.run]
source = ["supysonic"]
